<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel route planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; }
    body { display: flex; }
    aside { width: 340px; padding: 16px; overflow-y: auto; box-sizing: border-box; border-right: 1px solid #ddd; }
    #map { flex: 1; }
    form { display: grid; gap: 8px; }
    input, button { padding: 8px; font: inherit; }
    #summary { margin: 16px 0 8px; font-weight: 600; }
    #error { color: #b00020; }
    ol { padding-left: 20px; }
    li { margin-bottom: 10px; }
    small { color: #666; }
  </style>
</head>
<body>
  <aside>
    <form id="trip">
      <input name="start" value="New York, NY" placeholder="City, ST or lat,lng" required>
      <input name="finish" value="Los Angeles, CA" placeholder="City, ST or lat,lng" required>
      <button>Plan route</button>
    </form>
    <p id="error"></p>
    <p id="summary"></p>
    <ol id="stops"></ol>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([39.5, -98.35], 4);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    const layer = L.featureGroup().addTo(map);
    const el = (id) => document.getElementById(id);
    const escapeHtml = (value) => Object.assign(document.createElement("i"), { textContent: value }).innerHTML;
    const usd = (value) => value.toLocaleString("en-US", { style: "currency", currency: "USD" });

    function draw(plan) {
      const line = L.geoJSON(plan.route, { style: { weight: 4 } }).addTo(layer);
      L.circleMarker([plan.start.lat, plan.start.lng], { radius: 6, color: "#1b7f3b" }).addTo(layer);
      L.circleMarker([plan.finish.lat, plan.finish.lng], { radius: 6, color: "#b00020" }).addTo(layer);

      for (const stop of plan.stops) {
        const text = `${escapeHtml(stop.name)}<br>${escapeHtml(stop.city)}, ${stop.state}<br>` +
          `${stop.gallons} gal at $${stop.price} = ${usd(stop.cost)}`;
        L.marker([stop.lat, stop.lng]).bindPopup(text).addTo(layer);
        const item = document.createElement("li");
        item.innerHTML = `${text}<br><small>mile ${stop.mile} &middot; ${escapeHtml(stop.address)}</small>`;
        el("stops").append(item);
      }

      const hours = (plan.duration_minutes / 60).toFixed(1);
      el("summary").textContent =
        `${plan.distance_miles} mi, ${hours} h, ${plan.total_gallons} gal, ${usd(plan.total_cost)}`;
      map.fitBounds(line.getBounds(), { padding: [20, 20] });
    }

    el("trip").addEventListener("submit", async (event) => {
      event.preventDefault();
      layer.clearLayers();
      el("stops").replaceChildren();
      el("summary").textContent = "";
      el("error").textContent = "";

      const query = new URLSearchParams(new FormData(event.target));
      try {
        const response = await fetch(`/api/route/?${query}`);
        const body = await response.json();
        if (!response.ok) {
          el("error").textContent = Object.values(body).flat().join(" ");
          return;
        }
        draw(body);
      } catch {
        el("error").textContent = "The server could not be reached.";
      }
    });
  </script>
</body>
</html>
